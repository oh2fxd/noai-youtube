<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40">
  <defs>
    <filter id="blockShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Background Pill -->
  <rect x="2" y="2" width="96" height="36" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.8" filter="url(#blockShadow)"/>
  <!-- Circular Prohibition Sign -->
  <circle cx="20" cy="20" r="11" fill="none" stroke="#e11d48" stroke-width="2.6"/>
  <line x1="12" y1="28" x2="28" y2="12" stroke="#e11d48" stroke-width="2.6"/>
  <!-- Mini AI inside prohibition circle -->
  <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff">AI</text>
  <!-- BLOCK Button Text -->
  <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fda4af" letter-spacing="0.5">BLOCK</text>
</svg>
